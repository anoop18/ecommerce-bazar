spring:
  application:
    name: ecommerce-bazar

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_bazar_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: yourusername
    password: yourpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8085
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ecommerce-bazar}
    expiration: ${JWT_EXPIRATION:15m}
